version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gracepoint_postgres
    restart: always
    environment:
      POSTGRES_USER: gracepoint_user
      POSTGRES_PASSWORD: gracepoint_password
      POSTGRES_DB: gracepoint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gracepoint_user -d gracepoint_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gracepoint_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gracepoint.org
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
